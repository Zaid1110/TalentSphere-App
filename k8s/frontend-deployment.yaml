apiVersion: apps/v1
kind: Deployment

metadata:
  name: talentsphere-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: talentsphere-frontend

  template:
    metadata:
      labels:
        app: talentsphere-frontend

    spec:
      containers:
      - name: talentsphere-frontend

        image: zaidaftab/talentsphere-frontend:1

        ports:
        - containerPort: 80
