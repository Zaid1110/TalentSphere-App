apiVersion: apps/v1
kind: Deployment

metadata:
  name: talentsphere-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: talentsphere-backend

  template:
    metadata:
      labels:
        app: talentsphere-backend

    spec:
      containers:
      - name: talentsphere-backend

        image: zaidaftab/talentsphere-backend:1

        ports:
        - containerPort: 8080
	
	env:
	- name: SPRING_DATASOURCE_URL
 	  value: jdbc:mysql://mysql:3306/talentsphere

	- name: SPRING_DATASOURCE_USERNAME
  	  valueFrom:
    	    secretKeyRef:
      		name: mysql-secret
      		key: username

	- name: SPRING_DATASOURCE_PASSWORD
  	  valueFrom:
    	    secretKeyRef:
      		name: mysql-secret
      		key: password
