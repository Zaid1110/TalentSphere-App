services:

  mysql:

    image: mysql:8.4

    container_name: talentsphere-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: talentsphere

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:

    build:
      context: ./backend

    container_name: talentsphere-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/talentsphere
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

  frontend:

    build:
      context: ./frontend

    container_name: talentsphere-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mysql-data:
