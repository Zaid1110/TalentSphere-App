apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: pod-down-alert

  namespace: monitoring

spec:
  groups:
  - name: kubernetes

    rules:

    - alert: PodDown

      expr: up == 0

      for: 1m

      labels:
        severity: critical

      annotations:
        summary: Pod Down
        description: Kubernetes pod is down
