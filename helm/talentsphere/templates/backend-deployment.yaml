apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentsphere-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: talentsphere-backend

  template:
    metadata:
      labels:
        app: talentsphere-backend

    spec:
      containers:
      - name: talentsphere-backend

        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/talentsphere

        - name: SPRING_DATASOURCE_USERNAME
          value: root

        - name: SPRING_DATASOURCE_PASSWORD
          value: root123
