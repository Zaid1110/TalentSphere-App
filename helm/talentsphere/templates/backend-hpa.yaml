apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: talentsphere-backend-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: talentsphere-backend

  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: {{ .Values.hpa.cpuThreshold }}
